name: CI

# A push to main runs these checks through deploy.yml, which calls this
# workflow before it deploys, so they do not run twice.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Install aube
        run: |
          npm install --prefix "$RUNNER_TEMP/aube" --ignore-scripts=false @endevco/aube@2.10.0
          echo "$RUNNER_TEMP/aube/node_modules/.bin" >> "$GITHUB_PATH"
      - run: aube install --frozen-lockfile
      - run: aube run typecheck
      - run: aube run lint
      - run: aube run format:check
      - run: aube run build
      # Both Workers bundle: the board Worker and the MCP Worker beside it.
      - run: aube run build:workers
      # Two Vitest projects; the second runs both Workers together in workerd.
      - run: aube run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Install aube
        run: |
          npm install --prefix "$RUNNER_TEMP/aube" --ignore-scripts=false @endevco/aube@2.10.0
          echo "$RUNNER_TEMP/aube/node_modules/.bin" >> "$GITHUB_PATH"
      - run: aube install --frozen-lockfile
      # The browser builds that match the pinned @playwright/test; the dice
      # determinism spec runs the shared throw in all three engines.
      - run: aube exec playwright install --with-deps chromium firefox webkit
      - run: aube run e2e
