name: CI

# A push to main runs these checks through deploy.yml, which calls this
# workflow before it deploys, so they do not run twice.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run test

  e2e:
    name: e2e ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # NOTE: every shard runs to the end and reports its own failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # NOTE: Playwright downloads builds made for the runner's Ubuntu
      # release, so the key names both.
      - id: browsers
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          echo "key=playwright-$ImageOS-$version" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.key }}
      # The browser builds that match the pinned @playwright/test; the dice
      # determinism spec runs the shared throw in all three engines.
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bun run playwright install --with-deps chromium firefox webkit
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: bun run playwright install-deps chromium firefox webkit
      - run: bun run e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }} --workers=2
