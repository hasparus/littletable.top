name: CI

on:
  push:
    branches: [main]
  pull_request:
  # deploy.yml runs these checks before it deploys.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: aube install
      - run: aube run typecheck
      - run: aube run lint
      - run: aube run format:check
      - run: aube run build
      - run: aube run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: aube install
      # The browser build that matches the pinned @playwright/test.
      - run: aube exec playwright install --with-deps chromium
      - run: aube run e2e
