name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: aube install
      - run: aube run typecheck
      - run: aube run lint
      - run: aube run format:check
      - run: aube run build
      - run: aube run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: aube install
      # The browser builds that match the pinned @playwright/test; the dice
      # determinism spec runs the shared throw in all three engines.
      - run: aube exec playwright install --with-deps chromium firefox webkit
      - run: aube run e2e
