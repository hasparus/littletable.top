name: CI

# A push to main runs these checks through deploy.yml, which calls this
# workflow before it deploys, so they do not run twice.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - name: Check for new React Doctor findings
        if: github.event_name == 'pull_request'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: bun run doctor --scope changed --base "$BASE_COMMIT" --blocking warning

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run test

  e2e:
    name: e2e ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    container:
      # Match @playwright/test in package.json. The image supplies the browsers and system libraries.
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      # NOTE: every shard runs to the end and reports its own failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      # The Playwright image has npm but no unzip, which setup-bun requires.
      - run: |
          bun_package=$(node -p "require('./package.json').packageManager")
          npm install --global --prefix "$RUNNER_TEMP/bun" "$bun_package"
          echo "$RUNNER_TEMP/bun/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }} --workers=2
