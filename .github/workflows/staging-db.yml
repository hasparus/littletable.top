name: Staging database

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/staging-db.yml"
      - "alchemy.staging-db.ts"
      - "migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: littletable-staging-db
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply staging schema
    if: github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Deploy the shared staging database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./node_modules/.bin/alchemy deploy --config alchemy.staging-db.ts --stage staging --yes
