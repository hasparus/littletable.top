name: Review a submitted Gizmo

on:
  workflow_dispatch:
    inputs:
      source:
        description: GitHub gizmo.json permalink at the submitted commit
        type: string
        required: true
  issues:
    types: [opened]

permissions: {}

jobs:
  identify:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Submit Gizmo to marketplace')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      key: ${{ steps.source.outputs.key }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: source
        env:
          SOURCE: ${{ inputs.source || github.event.issue.body }}
        run: node .github/scripts/gizmo-submission.mjs identify

  propose:
    needs: identify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gizmo-review-${{ needs.identify.outputs.key }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Open or locate the registry review
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source || github.event.issue.body }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
        run: node .github/scripts/gizmo-submission.mjs propose
