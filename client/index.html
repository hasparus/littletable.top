<!doctype html>
<html lang="%TABLETOP_LANGUAGE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The link is the key to the board: no search engine may keep it. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%TABLETOP_SHORT_NAME%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="%TABLETOP_THEME_COLOR%" />
    <title>%TABLETOP_NAME%</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body class="bg-bg-secondary font-sans text-foreground antialiased">
    <div data-board-root class="fixed inset-0"><!-- boards-shell --><!-- landing-preview --></div>
  </body>
</html>
